<script src="sky.js" type="module"></script>
<!-- Vercel Web Analytics; /_vercel/insights only exists on Vercel, so locally the script 404s and va() just queues. -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  // A Mac app can't be installed from a phone, so on touch and phone-sized screens Download opens the share
  // sheet instead, or copies the link and says so for 2 s where there is none. style.css uses the same query.
  const dl = document.querySelector(".download"), dlLabel = dl.querySelector("span");
  const phone = matchMedia("(pointer: coarse), (max-width: 640px)");
  // Say what the button does there: AirDrop on iOS and iPadOS (iPadOS reports itself as a Mac with touch),
  // a plain send elsewhere, since Android has no AirDrop.
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  const label = () => (phone.matches ? (ios ? "AirDrop to Mac" : "Send to your Mac") : "Download for free");
  const setLabel = () => { if (!copyLink.t) dlLabel.textContent = label(); };
  const copyLink = async (url) => {
    await navigator.clipboard.writeText(url);
    dlLabel.textContent = "Link copied";
    clearTimeout(copyLink.t);
    copyLink.t = setTimeout(() => { copyLink.t = 0; dlLabel.textContent = label(); }, 2000);
  };
  setLabel(); phone.addEventListener("change", setLabel);
  document.querySelector(".gh").addEventListener("click", () => va("event", { name: "github" }));
  dl.addEventListener("click", async (e) => {
    if (!phone.matches) { va("event", { name: "download" }); return; }
    e.preventDefault();
    const data = { title: "Sirius", text: document.querySelector('meta[name="description"]').content, url: "https://trysirius.app" };
    try {
      if (navigator.share) await navigator.share(data); else await copyLink(data.url);
    } catch (err) {
      if (err.name === "AbortError") return;   // the share sheet was dismissed
      try { await copyLink(data.url); } catch { return; }
    }
    va("event", { name: "share" });
  });
</script>
<script defer src="/_vercel/insights/script.js"></script>
